version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudtrade-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cloudtrade_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudtrade-backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cloudtrade_db?schema=public
      JWT_SECRET: cloudtrade_secret_key
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudtrade-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://3.124.214.105:5000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  